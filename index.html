<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Detail Properti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<main class="wrap">
  <section class="gallery" aria-label="Galeri foto">
    <button class="main" id="main" aria-label="Perbesar foto"><img id="mainImg" alt=""><span class="cap" id="cap"></span><span class="count" id="count"></span></button>
    <div class="thumbs" id="thumbs"></div>
  </section>

  <section class="info">
    <p class="badge" id="status"></p>
    <h1 id="judul"></h1>
    <p class="loc" id="lokasi"></p>
    <p class="price" id="harga"></p>
    <a class="btn" id="waBtn" target="_blank" rel="noopener">Hubungi via WhatsApp</a>
  </section>

  <section class="block">
    <h2>Spesifikasi</h2>
    <dl class="specs" id="specs"></dl>
  </section>
  <section class="block">
    <h2>Deskripsi</h2>
    <p id="deskripsi"></p>
  </section>
  <section class="block">
    <h2>Fasilitas</h2>
    <ul class="chips" id="fasilitas"></ul>
  </section>
  <section class="block" id="petaBlock" hidden>
    <h2>Lokasi</h2>
    <a class="link" id="peta" target="_blank" rel="noopener">Buka di Google Maps</a>
  </section>
  <p class="foot" id="agen"></p>
</main>

<div class="stickyBar"><a class="btn" id="waBtn2" target="_blank" rel="noopener">Hubungi via WhatsApp</a></div>

<div class="lightbox" id="lb" hidden>
  <button class="x" id="lbClose" aria-label="Tutup">×</button>
  <button class="nav prev" id="lbPrev" aria-label="Sebelumnya">‹</button>
  <img id="lbImg" alt="">
  <button class="nav next" id="lbNext" aria-label="Berikutnya">›</button>
</div>
<script src="data.js"></script>
<script src="script.js"></script>
</body>
</html>
